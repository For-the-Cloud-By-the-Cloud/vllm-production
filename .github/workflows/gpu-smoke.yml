name: gpu-smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: gpu-t4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: nvidia-smi
      - run: pip install vllm
      - name: Serve and test
        run: |
          vllm serve Qwen/Qwen2.5-1.5B-Instruct --dtype half --max-model-len 4096 > vllm.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 10; done
          curl -sf localhost:8000/v1/completions -H 'Content-Type: application/json' \
            -d '{"model":"Qwen/Qwen2.5-1.5B-Instruct","prompt":"Hello","max_tokens":16}'
      - name: Show vLLM log
        if: always()
        run: tail -n 100 vllm.log || true
